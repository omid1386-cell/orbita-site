<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="../assets/css/media-gallery.css"/>
<style>body{margin:0;color:#e9f2ff;background:#050f1b;font-family:Tahoma,Arial,sans-serif}.demo-shell{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:100vh}.orbita-demo-world{display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#1b4561,#071221 70%)}.orbita-demo-map-caption{font-size:26px;color:#d5b66c;letter-spacing:2px;text-align:center}.demo-panel{background:#0b2032;padding:18px;overflow-y:auto;max-height:100vh}.demo-header{display:flex;align-items:center;gap:12px}.demo-header h2{font-size:19px;margin:4px 0 12px}.demo-name{border:1px solid #26445c;background:#102c43;border-radius:10px;padding:12px;margin-bottom:12px}#detailBody{min-height:200px}.demo-ui{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}.demo-ui button{background:#193953;color:#e9f5ff;padding:8px;border:1px solid #47617c;border-radius:9px;cursor:pointer}.d-head{border-bottom:1px solid #2b4862;padding:5px 0 14px}.d-head strong{font-size:18px}.demo-sub{font-size:12px;color:#8eb0ca;padding:12px 0}@media(max-width:760px){.demo-shell{display:block}.orbita-demo-world{height:100px}.demo-panel{max-height:none;padding:12px}}</style>
<script defer src="../assets/js/media-bank.js"></script><script defer src="../assets/js/media-gallery.js"></script>
</head><body><div class="demo-shell"><section class="orbita-demo-world"><div class="orbita-demo-map-caption">ORBITA<br><small style="font-size:12px;color:#8cb1cd">Media Gallery · Test Harness</small></div></section><aside class="demo-panel" id="detail" class="open"><div class="demo-header"><strong>RASPEHR</strong><span>·</span><span>Media stage 3</span></div><div class="demo-ui"><button id="setFa">فارسی</button><button id="setEn">English</button><button id="setAr">العربية</button><button id="nextProfile">Next profile</button></div><div id="detailBody"></div></aside></div>
<script>window.showQaProfile=function(profile,lang){var d=document.getElementById('detail'),b=document.getElementById('detailBody');d.classList.add('open');b.innerHTML='<div class="d-head"><strong></strong></div><p class="demo-sub">QA PROFILE — existing text preserved</p>';b.querySelector('strong').textContent=profile.o.en||profile.o.fa||profile.o.id;window.ORBITA_MEDIA_GALLERY.onProfileOpen(profile,lang||'fa');};
window.addEventListener('DOMContentLoaded',function(){var lang='fa',i=0;var profiles=[{cat:'agency',o:{id:'nasa',fa:'ناسا',en:'NASA'}},{cat:'site',o:{id:'ksc39a',fa:'پایگاه کندی',en:'Kennedy Space Center'}},{cat:'recovery',o:{id:'recovery-lz4',fa:'منطقه فرود چهار',en:'Landing Zone 4'}}];function render(){window.showQaProfile(profiles[i],lang);}document.getElementById('setFa').onclick=function(){lang='fa';render();};document.getElementById('setEn').onclick=function(){lang='en';render();};document.getElementById('setAr').onclick=function(){lang='ar';render();};document.getElementById('nextProfile').onclick=function(){i=(i+1)%profiles.length;render();};if (window.ORBITA_MEDIA_GALLERY) render();});</script>
</body></html>
