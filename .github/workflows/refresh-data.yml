# ORBITA — refresh launch/landing tabs every 8 hours.
# The pipeline is intentionally strict: API/schema/validation errors MUST make
# the run red and MUST NOT push partial data. Legacy UI regression tests with
# existing baseline failures are NOT silently considered refresh-gate tests.
name: refresh-upcoming-data

on:
  schedule:
    - cron: '17 1,9,17 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Offline LL2 compatibility and failure-gate tests
        run: python -m unittest discover -s tools -p 'test_ll2_refresh.py' -v

      - name: Refresh upcoming launches (LL2 v2.3)
        run: python tools/refresh_upcoming.py --apply

      - name: Refresh upcoming landings (LL2 v2.3)
        run: python tools/refresh_landings.py --apply --max-detail=4

      # Remaining budget: 2 launch + 2 landing lists + up to 4 landing
      # details + up to 4 site-stat counts + 1 history fetch = at most 13
      # calls per run (LL2 anonymous limit: 15/hour). If the optional seed
      # cannot fetch data it preserves the last valid state.
      - name: Incrementally seed site statistics (best effort)
        run: python tools/seed_site_stats.py --apply --max-sites=1

      - name: Refresh site history (LL2 v2.3)
        run: python tools/update_site_history.py --apply

      - name: Verify affected data contracts
        run: |
          node tests/upcoming.test.cjs
          node tests/upcoming_landings.test.cjs
          node tests/site_stats.test.cjs
          node tests/recovery.test.cjs

      - name: Publish validated data only if changed
        run: |
          git config user.name 'orbita-refresh-bot'
          git config user.email 'orbita-refresh-bot@users.noreply.github.com'
          git add data/upcoming.json data/upcoming_landings.json data/sites.json data/site_history_state.json
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git diff --cached --stat
            git commit -m "Auto-refresh: launches, landings and sites $(date -u +%Y-%m-%dT%H:%M)Z"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Record successful execution
        if: success()
        run: |
          {
            echo '## ORBITA refresh — successful'
            echo "- Run: ${GITHUB_RUN_ID}"
            echo "- UTC: $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo '- Launch Library version: 2.3.0'
            echo '- Both refresh jobs and all refresh data contracts passed.'
            echo '- Only validated changed data was committed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record failed execution
        if: failure()
        run: |
          {
            echo '## ORBITA refresh — failed'
            echo '- No partial/invalid refresh data was committed.'
            echo "- Check failed step logs for run ${GITHUB_RUN_ID}."
          } >> "$GITHUB_STEP_SUMMARY"
