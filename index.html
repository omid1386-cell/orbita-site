<!doctype html>
<html lang="fa" dir="rtl" data-theme="navy">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="سامانهٔ اطلاعات هوافضا: نقشهٔ جهانی پایگاه‌های پرتاب، پروژه‌های فضایی، و نمایش سه‌بعدی ماهواره‌های فعال در مدار زمین." />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#0b1a2b" />
<meta property="og:type" content="website" />
<meta property="og:title" content="ORBITA — سامانهٔ اطلاعات هوافضا" />
<meta property="og:description" content="نقشهٔ جهانی پایگاه‌های پرتاب، پروژه‌های فضایی، و نمایش سه‌بعدی ماهواره‌های فعال در مدار زمین." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='6' fill='%232fd4a7'/%3E%3C/svg%3E" />
<title>ORBITA — سامانهٔ اطلاعات هوافضا</title>
<link rel="stylesheet" href="assets/vendor/maplibre-gl.css?v=3" />
<script>
  window.ORBITA_V = "20261030country04";
  (function() {
    var ts = window.ORBITA_V;
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'assets/css/app.css?_t=' + ts;
    document.head.appendChild(link);
  })();
</script>
</head>
<body>

<header class="topbar">
  <div class="logo">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
      <ellipse cx="12" cy="12" rx="10" ry="4" fill="none" stroke="currentColor" stroke-width="1.4" transform="rotate(-25 12 12)"/>
      <circle cx="12" cy="12" r="4.6" fill="currentColor"/>
    </svg>
    <div><b>ORBITA</b><small data-i18n="tagline">سامانهٔ اطلاعات هوافضا</small></div>
  </div>

  <nav class="tabs">
    <button class="tab active" data-view="map"><span data-i18n="tab_map">نقشهٔ جهانی</span></button>
    <button class="tab" data-view="missions"><span data-i18n="tab_missions">پروژه‌های فضایی</span></button>
      </nav>

  <div class="topbar-actions">
    <button id="langBtn" class="ghost-btn" title="Language" data-i18n-title="change_language" aria-label="Change language">EN</button>
    <button id="themeBtn" class="ghost-btn" title="تغییر پوسته نقشه" data-i18n-title="toggle_theme">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3a9 9 0 108.5 12A7 7 0 0112 3z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<!-- ============ NEXT LAUNCH TICKER ============ -->
<div id="lnchBar" class="lnch-bar" hidden>
  <span class="lnch-dot" aria-hidden="true"></span>
  <span class="lnch-lbl" data-i18n="next_launch">پرتاب بعدی</span>
  <b class="lnch-name"><bdi id="lnchName"></bdi></b>
  <span class="lnch-sep" aria-hidden="true">·</span>
  <span class="lnch-prov"><bdi id="lnchProv"></bdi></span>
  <span class="lnch-cd" id="lnchCd"></span>
  <a class="lnch-live" id="lnchLive" href="#" target="_blank" rel="noopener noreferrer" hidden>
    <i aria-hidden="true"></i><span data-i18n="watch_live">پخش زنده</span>
  </a>
  <button class="lnch-x" id="lnchClose" data-i18n-title="close" title="بستن">✕</button>
</div>

<!-- ============ MAP VIEW ============ -->
<main id="view-map" class="view active">
  <div id="map"></div>
  <div id="mapStatus" class="map-status" data-i18n="loading_map">در حال بارگذاری نقشه…</div>

  <!-- horizontal layer bar -->
  <div class="layerbar" id="layerbar"></div>

  <button id="sideOpen" class="fab" title="جستجو" data-i18n-title="search">
    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10 2a8 8 0 105.3 14l4.4 4.4 1.4-1.4-4.4-4.4A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
  </button>

  <aside class="sidebar collapsed" id="sidebar">
    <div class="side-top">
      <div class="search-wrap">
        <input id="mapSearch" type="text" data-i18n-ph="ph_search_map" placeholder="جستجوی شرکت، پایگاه یا کشور..." autocomplete="off" />
      </div>
      <button id="sideClose" class="mini-btn" title="بستن" data-i18n-title="close">✕</button>
    </div>
    <div class="list-head"><span data-i18n="results">نتایج</span> <b id="resCount">0</b></div>
    <div id="resultList" class="result-list"></div>
  </aside>

  <div class="coords" id="coords">0.0, 0.0 · z0</div>

  <section id="detail" class="detail-panel">
    <button class="close-x" id="detailClose" title="بستن" data-i18n-title="close" aria-label="Close">✕</button>
    <div id="detailBody"></div>
  </section>
</main>

<!-- ============ MISSIONS VIEW ============ -->
<main id="view-missions" class="view">
  <div class="missions-wrap">

    <div class="toolbar">
      <button id="upRefresh" class="icon-btn" title="بروزرسانی" data-i18n-title="refresh">
        <svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M12 5V2L8 6l4 4V7a5 5 0 11-5 5H5a7 7 0 107-7z"/></svg>
      </button>
      <select id="fStatus" class="tb-select"></select>
      <select id="fOrbit" class="tb-select"></select>
      <select id="fType" class="tb-select"></select>
      <select id="fSort" class="tb-select"></select>
      <div class="tb-search">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M10 2a8 8 0 105.3 14l4.4 4.4 1.4-1.4-4.4-4.4A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
        <input id="mSearch" type="text" data-i18n-ph="ph_search_mission" placeholder="جستجو در نتایج بارگذاری‌شده..." />
      </div>
    </div>

    <div class="tablewrap">
      <div class="thead">
        <span class="col-mission" data-i18n="th_mission">مأموریت / زمان UTC</span>
        <span class="col-rocket" data-i18n="th_rocket">پرتابگر</span>
        <span class="col-op" data-i18n="th_op">ارائه‌دهنده</span>
        <span class="col-orbit" data-i18n="th_orbit">مدار</span>
        <span class="col-loc" data-i18n="th_loc">کشور / پایگاه</span>
        <span class="col-res" data-i18n="th_result">نتیجه</span>
        <span class="col-x"></span>
      </div>
      <div id="missionRows"></div>
    </div>

    <div class="upcoming">
      <div class="up-head">
        <span data-i18n="upcoming">پرتاب‌های پیش‌رو (زنده)</span>
        <span class="m-count"><b id="mCount">0</b> <span id="projectCountLabel" data-i18n="project">پروژه</span></span>
      </div>
      <div id="upList" class="up-list"><div class="up-empty" data-i18n="up_loading">در حال دریافت…</div></div>
    </div>

  </div>
</main>

<!-- ============ ORBIT (3D) VIEW ============ -->


<script src="assets/vendor/maplibre-gl.js?v=3"></script>
<script>
  (function() {
    var ts = window.ORBITA_V || Date.now();
    var s = document.createElement('script');
    s.src = 'assets/js/app.js?_t=' + ts;
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
